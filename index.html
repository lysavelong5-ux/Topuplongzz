<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longzztopup Angkor</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 50px;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 25px;
            border: 2px solid #333;
        }

        .profile-info h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .verified-badge {
            color: #1d9bf0;
            font-size: 18px;
        }

        .profile-info p {
            margin: 0;
            color: #b0b0b0;
            font-size: 14px;
        }

        .cards-wrapper {
            display: flex;
            gap: 20px;
            justify-content: space-between;
        }

        .card {
            background-color: #dcdfe6;
            color: #000000;
            flex: 1;
            padding: 25px 15px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            font-weight: bold;
        }

        .card span {
            font-size: 12px;
            color: #555555;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .footer {
            width: 100%;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #888888;
            background-color: #181818;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ផ្នែក Profile -->
        <div class="header">
            <img src="https://i.ibb.co/N6Qf41DC/logo.jpg" alt="Logo" class="logo">
            <div class="profile-info">
                <h1>Longzztopup Angkor <span class="verified-badge">✔</span></h1>
                <p>Topup game store Free Fire Mobile Roblox PUBG</p>
            </div>
        </div>

        <!-- ផ្នែក Cards សម្រាប់ជ្រើសរើសហ្គេម -->
        <div class="cards-wrapper">
            <div class="card">
                <h3>Free Fire</h3>
                <span>Topup</span>
            </div>
            <div class="card">
                <h3>Mobile</h3>
                <span>Topup</span>
            </div>
            <div class="card">
                <h3>Roblox</h3>
                <span>Topup</span>
            </div>
        </div>
    </div>

    <!-- ផ្នែក Footer ខាងក្រោមสุด -->
    <div class="footer">
        LY.seavlong 24/7 &nbsp;&nbsp;&nbsp; © copyright 2026 &nbsp;&nbsp;&nbsp; Fasting safe 10+1
    </div>

    <script>
        // កូដ JavaScript បន្ថែម (បើត្រូវការបញ្ជាសកម្មភាពផ្សេងៗពេលចុចលើ Card)
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => {
                const gameName = card.querySelector('h3').innerText;
                alert('អ្នកបានជ្រើសរើស: ' + gameName);
            });
        });
    </script>

</body>
</html>
