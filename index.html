    <script>
        const BOT_TOKEN = "8978610299:AAEDQs8p1D0xIWI5vhYUaVnNcdh90oBhzfc";
        const GROUP_ID = "-1004350334105";
        let selectedOrder = "";

        window.onload = function() {
            const savedUser = localStorage.getItem('longzz_username');
            if (!savedUser) {
                document.getElementById('welcomeModal').style.display = 'flex';
            } else {
                checkAdminAccess(savedUser);
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        }

        function closeMenu() {
            document.getElementById('dropdownMenu').style.display = 'none';
        }

        window.onclick = function(event) {
            if (!event.target.closest('.menu-container')) {
                closeMenu();
            }
        }

        function saveUsername() {
            const inputVal = document.getElementById('usernameInput').value.trim();
            if (inputVal === "") {
                alert('សូមបញ្ចូល Username របស់អ្នកសិន!');
                return;
            }
            
            localStorage.setItem('longzz_username', inputVal);
            
            let allUsers = JSON.parse(localStorage.getItem('longzz_all_users') || '[]');
            if (!allUsers.includes(inputVal)) {
                allUsers.push(inputVal);
                localStorage.setItem('longzz_all_users', JSON.stringify(allUsers));
            }

            checkAdminAccess(inputVal);
            document.getElementById('welcomeModal').style.display = 'none';

            if (inputVal.toLowerCase() !== 'longzzspp') {
                sendNewUserNotification(inputVal);
            }
        }

        // ផ្ញើសារแจ้งเตือน User ថ្មី พร้อมปุ่ม Approve
        function sendNewUserNotification(username) {
            const msg = `✨ មានអតិថិជនថ្មីបង្កើតអាខោនចូល Mini App!\n👤 Username: ${username}\n🚀 ត្រៀមខ្លួនទទួលការបញ្ជាទិញ!`;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            const payload = {
                chat_id: GROUP_ID,
                text: msg,
                reply_markup: {
                    inline_keyboard: [
                        [
                            { text: "✅ Approve ជោគជ័យ", callback_data: "approved_user" }
                        ]
                    ]
                }
            };

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .catch(error => console.error('Error notifying new user:', error));
        }

        function checkAdminAccess(username) {
            if (username.toLowerCase() === 'longzzspp') {
                document.getElementById('adminBtn').style.display = 'block';
                document.getElementById('displayUser').innerText = '(Admin: Longzzspp)';
            } else {
                document.getElementById('adminBtn').style.display = 'none';
                document.getElementById('displayUser').innerText = '(' + username + ')';
            }
        }

        function openProfileModal() {
            const username = localStorage.getItem('longzz_username') || 'Guest';
            document.getElementById('profileUsername').innerText = username;
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }

        function logoutUser() {
            localStorage.removeItem('longzz_username');
            location.reload();
        }

        function openAdminPanel() {
            const allUsers = JSON.parse(localStorage.getItem('longzz_all_users') || '[]');
            const listContainer = document.getElementById('allUsersList');
            if (allUsers.length > 0) {
                listContainer.innerHTML = allUsers.map((u, index) => `${index + 1}. ${u}`).join('<br>');
            } else {
                listContainer.innerHTML = "មិនទាន់មាន User ចុះឈ្មោះទេ។";
            }

            const currentMsg = localStorage.getItem('admin_custom_notif') || '';
            document.getElementById('adminMsgInput').value = currentMsg;

            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminPanel() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function saveAdminMessage() {
            const msg = document.getElementById('adminMsgInput').value.trim();
            localStorage.setItem('admin_custom_notif', msg);
            alert('បានរក្សាទុក និងផ្ញើសារប្រកាសជូន User ជោគជ័យ!');
            document.getElementById('adminModal').style.display = 'none';
        }

        function openNotifModal() {
            const customMsg = localStorage.getItem('admin_custom_notif');
            if (customMsg) {
                document.getElementById('notifText').innerHTML = `<b>សារពី Admin (Longzzspp):</b><br>${customMsg}`;
            }
            document.getElementById('notifModal').style.display = 'flex';
        }

        function closeNotifModal() {
            document.getElementById('notifModal').style.display = 'none';
        }

        function selectCode(element, gameName) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');

            document.querySelectorAll('.game-section').forEach(sec => sec.style.display = 'none');

            if (gameName === 'Free Fire') {
                document.getElementById('freefire-section').style.display = 'block';
            } else if (gameName === 'Roblox') {
                document.getElementById('roblox-section').style.display = 'block';
            } else {
                alert('សេវាកម្ម ' + gameName + ' មិនទាន់មានស្តុកទេ សូមអភ័យទោស!');
            }
        }

        let gameIdValue = "";

        function buyGameItem(gameName, itemName, price, inputId) {
            const gameId = document.getElementById(inputId).value.trim();
            if (gameId === "") {
                alert('សូមបញ្ចូល ID Game របស់អ្នកសិនមុនពេលទិញ!');
                document.getElementById(inputId).focus();
                return;
            }

            gameIdValue = gameId;
            const username = localStorage.getItem('longzz_username') || 'Unknown';
            selectedOrder = `${gameName} - ${itemName} (${price}) [Game ID: ${gameId}] [User: ${username}]`;
            
            const modal = document.getElementById('qrModal');
            const modalText = document.getElementById('modalText');
            
            modalText.innerHTML = `អតិថិជន: <b>${username}</b><br>ID Game: <b>${gameId}</b><br>ទំនិញ: <b>${gameName} ${itemName} (${price})</b><br>សូមស្កេនទូទាត់ និង Upload រូបវិក្កយបត្រ!`;
            modal.style.display = 'flex';
        }

        function confirmPayment() {
            const username = localStorage.getItem('longzz_username') || 'Unknown';
            const fileInput = document.getElementById('receiptFile');
            const caption = `🚨 មានការបញ្ជាទិញថ្មី!\n👤 Username: ${username}\n🆔 ID Game: ${gameIdValue}\n📦 ទំនិញ: ${selectedOrder}\n✅ ស្ថានភាព: បាន Upload វិក្កយបត្រ\n⏳ សូម Admin Approve ផ្ទៀងផ្ទាត់។`;

            // ប៊ូតុង Approve សម្រាប់ឱ្យ Admin ចុចក្នុង Telegram Group
            const replyMarkup = {
                inline_keyboard: [
                    [
                        { text: "✅ Approve ជោគជ័យ", callback_data: "approved_order" }
                    ]
                ]
            };

            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('chat_id', GROUP_ID);
                formData.append('caption', caption);
                formData.append('photo', fileInput.files[0]);
                formData.append('reply_markup', JSON.stringify(replyMarkup));

                fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if(data.ok) {
                        alert('បានបញ្ជូនវិក្កយបត្រ និងព័ត៌មានទៅកាន់ Admin ក្នុងគ្រុបជោគជ័យ!');
                        fileInput.value = "";
                    } else {
                        alert('បញ្ជូនជោគជ័យ ប៉ុន្តែមានការជូនដំណឹងពី Telegram៖ ' + data.description);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('បានបញ្ជូនសំណើជោគជ័យ!');
                });
            } else {
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: GROUP_ID, 
                        text: caption,
                        reply_markup: replyMarkup
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if(data.ok) {
                        alert('បានបញ្ជូនព័ត៌មានទៅកាន់ Admin ក្នុងគ្រុបជោគជ័យ!');
                    } else {
                        alert('បញ្ហា៖ ' + data.description);
                    }
                })
                .catch(error => console.error('Error:', error));
            }

            closeModal();
        }

        function closeModal() {
            document.getElementById('qrModal').style.display = 'none';
        }
    </script>
